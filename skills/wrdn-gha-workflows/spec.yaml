managed_by: skillet
spec_version: 1
name: wrdn-gha-workflows
class: security-review
intent: Find exploitable GitHub Actions workflow defects where CI boundaries turn untrusted or caller-controlled data into code execution, credential exposure, repository mutation, package publication, release tampering, or runner compromise. Trace the chain from trigger or caller to sink to privilege before reporting; this is exploit review, not workflow style.
triggers:
  should:
    - audit these GitHub Actions workflows for security issues
    - review this pull_request_target workflow
    - check this workflow for expression injection
    - look at the release workflow inputs for injection
    - review the reusable workflow secrets exposure
    - scan these composite actions for unsafe shell interpolation
    - check GHA permissions and token scope on this workflow
    - find pwn_request style bugs in our CI
    - review this workflow_run handler for artifact poisoning
    - is this chatops workflow command-injection safe
    - audit our self-hosted runner workflow exposure
  should_not:
    - add a new CI job to run my tests
    - explain how GitHub Actions matrix syntax works
    - format and lint this workflow file
    - review this Python web app for SQL injection
    - fix the failing build on main
    - set up branch protection rules
    - configure CODEOWNERS for this repo
behaviors:
  - id: enumerate-triggers-and-callers
    statement: Enumerate every trigger (`on:` events) and every caller of reusable workflows and composite actions before assessing any step, and label each as trusted or attacker-controlled.
    rationale: Exploitability begins at the trust boundary; without knowing the entry point, a sink finding is unranked and often wrong.
    dimensions:
      - exploit-paths
      - vulnerability-classes
  - id: map-trust-boundaries
    statement: For each job, identify whether it runs in a trusted context (target repo secrets, write tokens, base ref) or an untrusted context (PR head, fork code), and note transitions caused by `actions/checkout` refs, `workflow_run` downloads, or cache/artifact restores.
    rationale: Most GHA exploits hinge on a trusted context executing PR-controlled content; the boundary must be explicit before sinks are evaluated.
    dimensions:
      - exploit-paths
      - vulnerability-classes
  - id: resolve-local-actions-and-reusable-workflows
    statement: "Resolve and read every local action (`./path`), composite action, reusable workflow (`uses: ./.github/...` or `org/repo/.github/workflows/x.yml@ref`), and script invoked from `run:` so sinks inside them are analyzed, not assumed safe."
    rationale: Sinks are routinely hidden one or two indirections deep; skipping resolution produces false negatives and shallow reports.
    dimensions:
      - exploit-paths
      - vulnerability-classes
  - id: flag-expression-injection-in-run
    statement: Flag `${{ ... }}` interpolation of attacker-controlled fields (PR title/body, branch name, commit message, issue/comment/discussion body, label name, head ref, author fields) directly into `run:`, composite `run:`, or shell steps as expression injection RCE in the surrounding context.
    rationale: Direct interpolation into shell is the canonical GHA RCE primitive (`pwn_request`-style); it must be reported with the precise sink and trigger.
    dimensions:
      - vulnerability-classes
      - exploit-paths
  - id: flag-script-action-injection
    statement: Flag interpolation of attacker-controlled expressions into `actions/github-script`, `actions/script`, or equivalent JS/Python script bodies, and recommend reading values via `env:` or `context` instead of inline `${{ }}`.
    rationale: github-script bodies are evaluated as JS; expression interpolation yields code execution with the job's `GITHUB_TOKEN`.
    dimensions:
      - vulnerability-classes
      - remediations
  - id: flag-workflow-command-file-injection
    statement: Flag writes of attacker-controlled data to `$GITHUB_ENV`, `$GITHUB_OUTPUT`, `$GITHUB_PATH`, or `$GITHUB_STEP_SUMMARY` without sanitization, and trace whether downstream steps consume the polluted variable in a privileged sink.
    rationale: Workflow command files allow newline-based injection that mutates env/PATH/outputs across steps, frequently escalating to RCE in later trusted steps.
    dimensions:
      - vulnerability-classes
      - exploit-paths
  - id: flag-pull-request-target-checkout-of-pr-head
    statement: "Flag `pull_request_target` workflows that check out PR head code (`ref: ${{ github.event.pull_request.head.sha }}` or head ref) and then run build, test, install, lint, codegen, or any script from the checkout, as full RCE in the trusted context."
    rationale: "This is the textbook `pwn_request` pattern: PR-controlled code executes with target repo secrets and write token."
    dimensions:
      - vulnerability-classes
      - exploit-paths
  - id: flag-workflow-run-artifact-and-pr-data-trust
    statement: Flag privileged `workflow_run` jobs that download artifacts, read PR metadata, or check out PR head from the triggering run and then execute, evaluate, or interpolate that data.
    rationale: "`workflow_run` runs with full target privileges; trusting artifacts or PR data from the upstream run reintroduces the same exploit path as `pull_request_target`."
    dimensions:
      - vulnerability-classes
      - exploit-paths
  - id: flag-cache-poisoning-paths
    statement: Flag privileged jobs that restore caches, dependency lockfiles, or build outputs whose keys can be populated by untrusted PR or fork runs, and trace whether the cached content is later executed.
    rationale: Cross-context cache restore turns an unprivileged PR run into a code-injection primitive against trusted jobs.
    dimensions:
      - vulnerability-classes
      - exploit-paths
  - id: flag-mutable-third-party-actions
    statement: Flag third-party `uses:` references pinned to a branch or mutable tag (e.g. `@main`, `@v1`) in workflows that hold secrets, write tokens, OIDC, publish credentials, or self-hosted runners, and require a commit SHA pin.
    rationale: A mutable ref lets the action author or a tag-rewrite attack run arbitrary code in a privileged context.
    dimensions:
      - vulnerability-classes
      - remediations
  - id: flag-overbroad-permissions-with-traced-sink
    statement: "Flag `permissions:` grants (especially `contents: write`, `packages: write`, `id-token: write`, `pull-requests: write`) when paired with a traced attacker- or caller-controlled execution path; do not flag broad permissions in isolation."
    rationale: Permission scope is only a finding when an exploit path can spend it; reporting blanket permissions without a path produces noise.
    dimensions:
      - severity-calibration
      - false-positive-controls
  - id: flag-secret-and-pat-exposure
    statement: Flag steps that pass `secrets.*`, PATs, deploy keys, npm/pypi/registry tokens, signing keys, or OIDC-derived credentials into untrusted code paths, log them, write them to artifacts, or expose them via `set-output`/env to later untrusted steps.
    rationale: Secret exfiltration is a primary impact class; tracing the secret to an untrusted sink is the finding.
    dimensions:
      - vulnerability-classes
      - exploit-paths
  - id: flag-oidc-misuse
    statement: "Flag workflows that mint cloud OIDC tokens (`id-token: write`) in jobs reachable by untrusted PR code, fork callers, or unauthenticated chatops, and check the audience/subject claims trusted by the cloud role."
    rationale: OIDC tokens issued from a compromised job grant cloud access; subject/audience misconfiguration extends blast radius beyond the repo.
    dimensions:
      - vulnerability-classes
      - exploit-paths
  - id: flag-self-hosted-runner-exposure
    statement: Flag workflows on `self-hosted` runners that accept untrusted code paths (PR head checkout, untrusted `workflow_run`, comment-driven exec) without ephemeral runner guarantees.
    rationale: Self-hosted runners persist state; one untrusted execution compromises every subsequent job on that runner.
    dimensions:
      - vulnerability-classes
      - severity-calibration
  - id: flag-chatops-without-authorization
    statement: Flag `issue_comment`, `pull_request_review`, `discussion_comment`, and label-driven workflows that dispatch privileged actions without an explicit author association or membership check (e.g. `OWNER`, `MEMBER`, `COLLABORATOR`), and flag any that interpolate comment bodies into shell.
    rationale: Chatops triggers default to anyone on the internet who can comment; missing authorization plus shell interpolation is a remote RCE primitive.
    dimensions:
      - vulnerability-classes
      - exploit-paths
  - id: flag-release-and-publish-input-injection
    statement: In release, deploy, publish, and PR-creation workflows, flag `workflow_dispatch`/`workflow_call` free-form `string` inputs that flow into `run:`, tag names, version strings, registry commands, or git operations, and assess RCE or supply-chain tampering.
    rationale: Release pipelines hold the strongest secrets; even caller-controlled inputs become high-impact when they reach shell or publish sinks.
    dimensions:
      - vulnerability-classes
      - exploit-paths
      - severity-calibration
  - id: calibrate-workflow-dispatch-severity
    statement: Treat `workflow_dispatch` and `workflow_call` as manual/caller-controlled by default; raise severity only when an external or lower-trust route reaches the input (reusable workflow called from a public-trigger workflow, repository_dispatch, API exposure).
    rationale: Prevents false-positive RCE reports on inputs that only a maintainer can supply.
    dimensions:
      - severity-calibration
      - false-positive-controls
  - id: treat-choice-inputs-as-hardening
    statement: Treat hardcoded shell-safe `choice` or `boolean` inputs as hardening, not as automatic injection sinks; only flag when a `choice` value is itself shell-unsafe or is concatenated with attacker-controlled data.
    rationale: Constrained inputs are not exploitable on their own; reporting them as RCE wastes reviewer trust.
    dimensions:
      - false-positive-controls
      - severity-calibration
  - id: investigate-context-fields-for-controllability
    statement: For each `${{ github.* }}` or `${{ inputs.* }}` field, determine whether it is attacker-controlled (PR fields, head ref, comment body), caller-controlled (reusable workflow input), or trusted (commit SHA, run id, repository), and base findings on that classification.
    rationale: Not every context field is dangerous; classification is what separates a real injection from noise.
    dimensions:
      - false-positive-controls
      - exploit-paths
  - id: check-env-vs-interpolation-mitigation
    statement: When an attacker-controlled value is read via `env:` and consumed as `"$VAR"` in shell, do not report expression injection on that path; verify quoting and word-splitting before clearing it.
    rationale: The standard mitigation is `env:` + quoted shell variables; treating it as a finding produces false positives.
    dimensions:
      - false-positive-controls
      - remediations
  - id: report-with-trace-and-fix
    statement: "Every finding must include: file:line, trigger/caller entry point, attacker- or caller-controlled input, execution mechanism (sink), privileges exposed (permissions, secrets, runner), impact, confidence, and a concrete fix (env-var pattern, SHA pin, authorization gate, permission narrowing, ephemeral runner)."
    rationale: Reviewers need an exploit chain and a remediation, not a vague risk label.
    dimensions:
      - remediations
      - exploit-paths
      - severity-calibration
  - id: calibrate-severity-by-privilege-and-reach
    statement: "Calibrate severity by the privileges the exploit reaches: critical for write-token RCE on default branch, secret exfiltration, package publish, or self-hosted runner takeover; high for repo mutation or release tampering; medium for read-token leak or bounded artifact poisoning; low for hardening that lacks a traced sink."
    rationale: Severity must reflect blast radius; uniform severity collapses signal.
    dimensions:
      - severity-calibration
  - id: load-references-conditionally
    statement: Based on the workflow patterns observed (pull_request_target, workflow_run, chatops, reusable/release inputs, OIDC, self-hosted runners, third-party actions), load the matching reference file from `references/` before producing findings in that area.
    rationale: Domain is too broad for one file; conditional loading keeps the working context focused on the patterns actually present.
    dimensions:
      - vulnerability-classes
must_not:
  - id: no-style-or-formatting-findings
    statement: Do not report YAML formatting, missing `name:`, generic actionlint style, or non-security best practices.
    rationale: Skill is exploit review; style noise drowns real findings.
  - id: no-broad-permissions-without-path
    statement: Do not report broad `permissions:` or privileged triggers without a traced attacker- or caller-controlled execution path.
    rationale: Permission breadth alone is not an exploit; reporting it as one is false positive.
  - id: no-vague-resemblance-findings
    statement: Do not report findings based on resemblance to a known pattern; require a concrete trigger-to-sink trace.
    rationale: Pattern-matching without tracing produces unranked, unactionable reports.
  - id: no-rce-claim-on-constrained-inputs
    statement: Do not claim RCE on `choice`/`boolean` inputs whose values are hardcoded and shell-safe.
    rationale: Constrained inputs are not exploitable on their own.
  - id: no-rce-claim-on-env-quoted-pattern
    statement: Do not claim expression injection when the attacker value is read via `env:` and used as a quoted shell variable, unless quoting is broken or the value reaches a non-shell sink (eval, code, github-script).
    rationale: That pattern is the recommended mitigation; flagging it erodes trust.
  - id: no-out-of-scope-app-vulns
    statement: Do not report standalone application vulnerabilities outside CI unless the vulnerable code is loaded or executed by the workflow under review.
    rationale: Skill is scoped to GHA exploitability.
  - id: no-policy-gaps-as-workflow-bugs
    statement: Do not report missing branch protection, CODEOWNERS, or required-reviewer rules as workflow findings unless the workflow itself creates the exploitable path.
    rationale: Repo policy is out of scope for workflow exploit review.
  - id: no-skipping-action-resolution
    statement: Do not declare a step safe without resolving and reading the local action, composite action, or reusable workflow it invokes.
    rationale: Sinks frequently live one indirection deep; skipping resolution causes false negatives.
  - id: no-dispatch-rce-without-external-route
    statement: Do not escalate `workflow_dispatch` injection to RCE severity unless an external or lower-trust route to the input is identified.
    rationale: Maintainer-only inputs are not remote exploits.
  - id: no-cross-skill-handoff
    statement: Do not instruct the agent to invoke another named skill at runtime; state the intent directly.
    rationale: Skills must be runtime-independent.
references:
  - path: references/pull-request-target-and-workflow-run.md
    title: pull_request_target and workflow_run exploit patterns
    load_when: The workflow uses `pull_request_target`, `workflow_run`, or otherwise consumes PR head code, artifacts, or PR metadata in a trusted context.
    purpose: Document the canonical pwn_request and workflow_run artifact-trust exploit chains, with safe and unsafe checkout patterns.
    topics:
      - vulnerability-patterns
      - remediations
  - path: references/expression-injection-sinks.md
    title: Expression injection sinks and safe interpolation
    load_when: Any step uses `${{ }}` interpolation in `run:`, composite `run:`, `actions/github-script`, `actions/script`, or writes to `$GITHUB_ENV`/`$GITHUB_OUTPUT`/`$GITHUB_PATH`.
    purpose: Catalogue interpolation sinks, the env-var mitigation, and workflow-command-file injection variants.
    topics:
      - vulnerability-patterns
      - remediations
      - false-positive-traps
  - path: references/chatops-and-comment-triggers.md
    title: Chatops, comment, label, and discussion triggers
    load_when: The workflow triggers on `issue_comment`, `pull_request_review`, `pull_request_review_comment`, `discussion`, `discussion_comment`, or label/assignee events that dispatch privileged actions.
    purpose: Cover authorization checks (author_association, membership), comment-body interpolation, and slash-command parsing.
    topics:
      - vulnerability-patterns
      - remediations
  - path: references/reusable-and-dispatch-inputs.md
    title: Reusable workflows, workflow_call, and workflow_dispatch inputs
    load_when: The workflow defines `workflow_call` or `workflow_dispatch`, is called by another workflow, or runs release/publish/PR-creation logic driven by inputs.
    purpose: Calibrate caller-controlled severity, choice/boolean hardening, and traced paths from public-trigger callers into reusable workflows.
    topics:
      - false-positive-traps
      - remediations
  - path: references/secrets-oidc-and-tokens.md
    title: Secrets, GITHUB_TOKEN scope, OIDC, and registry credentials
    load_when: "The workflow uses `secrets.*`, sets `id-token: write`, publishes packages, signs releases, or pushes to remote registries."
    purpose: Trace credential flow to untrusted sinks and check OIDC subject/audience constraints.
    topics:
      - vulnerability-patterns
      - remediations
  - path: references/runners-actions-and-supply-chain.md
    title: Self-hosted runners, third-party actions, and cache supply chain
    load_when: The workflow uses `self-hosted` runners, third-party `uses:` references, or restores caches/artifacts that may cross trust boundaries.
    purpose: Cover ephemeral-runner requirements, SHA pinning, and cache-poisoning paths.
    topics:
      - vulnerability-patterns
      - remediations
  - path: references/false-positive-traps.md
    title: False-positive traps and severity calibration
    load_when: Before producing findings, or when uncertain whether a pattern is exploitable or merely non-ideal.
    purpose: List the recurring traps (env-var mitigation, choice inputs, broad permissions without path, dispatch-only inputs) and severity calibration rules.
    topics:
      - false-positive-traps
      - remediations
