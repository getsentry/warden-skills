name: Manual Lint
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Path to lint'
        required: true
        type: string
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Linting ${{ inputs.path }}"
          eslint ${{ inputs.path }}
