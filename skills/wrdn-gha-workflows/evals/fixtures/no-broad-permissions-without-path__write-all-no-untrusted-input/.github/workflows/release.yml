name: Release
on:
  push:
    tags:
      - 'v*'
permissions: write-all
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make build
          make test
      - name: Publish
        run: make publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
