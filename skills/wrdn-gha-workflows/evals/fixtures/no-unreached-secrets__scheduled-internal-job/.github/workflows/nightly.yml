name: Nightly Internal Sync
on:
  schedule:
    - cron: '0 3 * * *'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push metrics to internal API
        env:
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $INTERNAL_API_TOKEN" \
            https://metrics.internal.example.com/ingest \
            --data-binary @./reports/nightly.json
