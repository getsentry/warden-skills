name: PR
on:
  pull_request_target:
    types: [opened, synchronize]
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/greet
        with:
          title: ${{ github.event.pull_request.title }}
