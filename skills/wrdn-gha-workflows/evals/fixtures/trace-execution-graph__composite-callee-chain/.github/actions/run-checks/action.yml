name: Run Checks
description: Runs project checks
inputs:
  pr-title:
    description: PR title for logging
    required: true
runs:
  using: composite
  steps:
    - name: Log PR
      shell: bash
      run: echo "Building PR: ${{ inputs.pr-title }}"
    - name: Install
      shell: bash
      run: npm ci
    - name: Test
      shell: bash
      run: npm test
