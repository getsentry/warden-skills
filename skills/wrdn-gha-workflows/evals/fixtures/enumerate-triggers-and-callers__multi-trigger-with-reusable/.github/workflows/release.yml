name: Release
on:
  pull_request_target:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/local-package
        with:
          tag: ${{ inputs.tag }}
