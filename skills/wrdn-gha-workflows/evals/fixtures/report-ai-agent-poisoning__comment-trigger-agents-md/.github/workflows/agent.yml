name: AI Agent
on:
  issue_comment:
    types: [created]
jobs:
  agent:
    if: contains(github.event.comment.body, '/agent')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
      - uses: cursor/cursor-agent-action@main
        with:
          api_key: ${{ secrets.CURSOR_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
