name: CI
on:
  pull_request_target:
    types: [opened, synchronize]
jobs:
  build:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          npm ci
          npm run build
          npm test
