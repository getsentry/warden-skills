name: Comment PR
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run build script from artifact
        run: |
          chmod +x ./dist/post-build.sh
          ./dist/post-build.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
