name: Deploy
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      level:
        description: 'Log level'
        required: true
        type: choice
        options:
          - info
          - debug
          - warn
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Deploying to ${{ inputs.env }} at level ${{ inputs.level }}"
          ./scripts/deploy.sh --env ${{ inputs.env }} --log ${{ inputs.level }}
