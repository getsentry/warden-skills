name: Release
on:
  pull_request_target:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run local action
        uses: ./.github/actions/build-and-publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
