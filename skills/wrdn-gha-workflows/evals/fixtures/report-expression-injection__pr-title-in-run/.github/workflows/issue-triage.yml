name: Triage
on:
  pull_request_target:
    types: [opened, edited]
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Log PR title
        run: |
          echo "Processing PR: ${{ github.event.pull_request.title }}"
          echo "pr_title=${{ github.event.pull_request.title }}" >> $GITHUB_ENV
