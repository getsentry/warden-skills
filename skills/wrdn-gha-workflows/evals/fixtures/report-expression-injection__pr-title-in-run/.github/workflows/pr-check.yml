name: PR Check
on:
  pull_request_target:
    types: [opened, edited, synchronize]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Echo PR title
        run: |
          echo "Processing PR: ${{ github.event.pull_request.title }}"
          ./scripts/process.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
