name: PR Validate
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/_build-and-test.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    with:
      pr_ref: ${{ github.event.pull_request.head.sha }}
      pr_title: ${{ github.event.pull_request.title }}
