name: Build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: some-vendor/build-tool@v1
        with:
          config: ./build.yaml
      - run: ./scripts/sign.sh
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
