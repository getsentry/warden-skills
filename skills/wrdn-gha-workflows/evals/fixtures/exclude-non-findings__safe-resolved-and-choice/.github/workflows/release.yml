name: Release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
jobs:
  build:
    if: ${{ github.event.pull_request.number != 0 }}
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build
        run: |
          echo "Building for $TARGET_ENV"
          make build
