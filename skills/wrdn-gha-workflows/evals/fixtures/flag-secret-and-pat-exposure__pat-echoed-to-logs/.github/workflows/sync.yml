name: Sync
on:
  schedule:
    - cron: '0 * * * *'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Debug auth
        run: |
          echo "Using token: ${{ secrets.GH_PAT }}"
          curl -H "Authorization: token ${{ secrets.GH_PAT }}" https://api.github.com/user
      - name: Save creds
        run: echo "${{ secrets.GH_PAT }}" > creds.txt
      - uses: actions/upload-artifact@v4
        with:
          name: debug
          path: creds.txt
