name: Triage
on:
  pull_request_target:
    types: [opened]
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add WIP label
        if: ${{ contains(github.event.pull_request.title, 'WIP') }}
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: wip
