name: Chatops
on:
  issue_comment:
    types: [created]
jobs:
  run:
    if: startsWith(github.event.comment.body, '/deploy')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run command
        run: |
          echo "Running: ${{ github.event.comment.body }}"
          ./scripts/deploy.sh ${{ github.event.comment.body }}
