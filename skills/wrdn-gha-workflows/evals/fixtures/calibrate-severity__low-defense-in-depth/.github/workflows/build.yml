name: Build
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: |
          echo "Building PR #${{ github.event.pull_request.number }}"
          npm ci
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
