name: Deploy
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
permissions:
  contents: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: node dist/index.js
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
