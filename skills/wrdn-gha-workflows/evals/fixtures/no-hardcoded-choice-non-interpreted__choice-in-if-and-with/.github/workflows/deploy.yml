name: Deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        type: choice
        required: true
        options:
          - staging
          - production
      dry_run:
        description: 'Dry run'
        type: boolean
        default: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: inputs.target == 'production'
        uses: some-org/deploy-action@v1
        with:
          environment: ${{ inputs.target }}
          dry-run: ${{ inputs.dry_run }}
