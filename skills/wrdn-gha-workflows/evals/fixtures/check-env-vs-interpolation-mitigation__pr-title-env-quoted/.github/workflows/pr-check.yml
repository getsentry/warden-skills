name: PR Check
on:
  pull_request_target:
    types: [opened, edited]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Echo PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title is: $PR_TITLE"
          if [[ "$PR_TITLE" == *"WIP"* ]]; then
            echo "work in progress"
          fi
