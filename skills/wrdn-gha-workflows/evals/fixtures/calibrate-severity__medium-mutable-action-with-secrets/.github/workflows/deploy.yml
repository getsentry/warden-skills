name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: some-third-party/deploy-action@v1
        with:
          aws-region: us-east-1
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
