name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Build and tag
        run: |
          echo "Releasing ${{ github.event.inputs.tag }}"
          ./scripts/release.sh "${{ github.event.inputs.tag }}"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
