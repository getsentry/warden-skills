name: Reusable Publish
on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      git_ref:
        required: true
        type: string
    secrets:
      REGISTRY_TOKEN:
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release tag
        run: |
          git tag release-${{ inputs.git_ref }}
          git push origin release-${{ inputs.git_ref }}
      - name: Publish package
        run: |
          cd packages/${{ inputs.package_name }}
          npm publish --registry https://registry.example.com
        env:
          NPM_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
