name: Triage
on:
  pull_request_target:
    types: [opened, edited]
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add bug label
        if: contains(github.event.pull_request.title, '[bug]')
        uses: actions-ecosystem/action-add-labels@v1
        with:
          labels: bug
      - name: Echo title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE"
