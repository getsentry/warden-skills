name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag and publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm version ${{ inputs.version }}
          npm publish
