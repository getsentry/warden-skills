name: PR Comment
on:
  pull_request_target:
    types: [opened]
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Echo title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title is: $PR_TITLE"
          echo "Length: ${#PR_TITLE}"
