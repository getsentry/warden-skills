name: Release
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        run: |
          echo "COMMIT_MSG=${{ github.event.head_commit.message }}" >> $GITHUB_ENV
      - name: Use it
        run: echo "Building $COMMIT_MSG"
