name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: some-vendor/setup-tool@main
      - uses: another-org/publish-action@v1
        with:
          token: ${{ secrets.NPM_TOKEN }}
