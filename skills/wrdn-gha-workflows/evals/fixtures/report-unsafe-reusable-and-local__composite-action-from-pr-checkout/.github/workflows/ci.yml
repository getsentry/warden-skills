name: CI
on:
  pull_request_target:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/run-tests
        with:
          label: ${{ github.event.pull_request.title }}
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
