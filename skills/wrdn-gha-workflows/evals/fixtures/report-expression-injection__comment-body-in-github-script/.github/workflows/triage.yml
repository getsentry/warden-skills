name: Triage
on:
  issue_comment:
    types: [created]
jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ github.event.comment.body }}`;
            console.log('Got comment:', body);
            if (body.includes('/deploy')) {
              await github.rest.repos.createDeployment({ owner: context.repo.owner, repo: context.repo.repo, ref: 'main' });
            }
