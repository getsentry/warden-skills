name: Comment Bot
on:
  issue_comment:
    types: [created]
jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ github.event.comment.body }}`;
            console.log('Got comment:', body);
            if (body.includes('deploy')) {
              core.setOutput('action', 'deploy');
            }
