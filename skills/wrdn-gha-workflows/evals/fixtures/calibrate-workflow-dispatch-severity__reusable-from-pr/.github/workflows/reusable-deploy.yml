name: Reusable Deploy
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run target
        run: |
          echo "Deploying to ${{ inputs.target }}"
