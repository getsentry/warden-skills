name: Triage
on:
  pull_request_target:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Echo title
        run: |
          echo "Processing PR: ${{ github.event.pull_request.title }}"
          npm install
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
