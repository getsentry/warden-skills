name: Deploy
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
          - canary
      dry_run:
        description: 'Dry run'
        required: true
        type: boolean
        default: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Deploying to ${{ inputs.env }}"
          ./deploy.sh --env=${{ inputs.env }} --dry-run=${{ inputs.dry_run }}
