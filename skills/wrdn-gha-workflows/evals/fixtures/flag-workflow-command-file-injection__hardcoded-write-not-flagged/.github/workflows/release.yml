name: Release
on:
  push:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Set version
        run: |
          echo "VERSION=1.2.3" >> $GITHUB_ENV
          echo "BUILD_TYPE=release" >> $GITHUB_OUTPUT
      - name: Build
        run: make build VERSION=$VERSION
