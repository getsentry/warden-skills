name: PR Build
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ./build-output
          key: build-cache-${{ github.event.pull_request.head.ref }}
      - run: npm ci && npm run build
