name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: target env
        required: true
        type: choice
        options:
          - staging
          - production
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying to ${{ inputs.environment }}" && ./deploy.sh ${{ inputs.environment }}
