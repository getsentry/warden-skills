name: 'Build'
description: 'Custom build action'
inputs:
  title:
    description: 'PR title'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Echo title
      shell: bash
      run: |
        echo "Building PR: ${{ inputs.title }}"
        echo "${{ inputs.title }}" > /tmp/title.txt
