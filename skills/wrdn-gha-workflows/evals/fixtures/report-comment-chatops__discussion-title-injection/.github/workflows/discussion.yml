name: Discussion Handler
on:
  discussion:
    types: [created]
jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Greet
        run: |
          echo "New discussion: ${{ github.event.discussion.title }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
