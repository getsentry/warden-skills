name: Triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set tool path from issue
        run: |
          echo "${{ github.event.issue.body }}" >> $GITHUB_PATH
      - name: Run linter
        run: |
          mylinter --check .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
