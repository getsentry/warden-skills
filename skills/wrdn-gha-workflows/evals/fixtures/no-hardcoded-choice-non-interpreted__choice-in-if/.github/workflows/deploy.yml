name: Deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        type: choice
        required: true
        options:
          - staging
          - production
      dry_run:
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        if: ${{ inputs.target == 'staging' }}
        run: ./deploy.sh staging
      - name: Deploy to prod
        if: ${{ inputs.target == 'production' && !inputs.dry_run }}
        uses: some-org/deploy-action@v1
        with:
          environment: ${{ inputs.target }}
