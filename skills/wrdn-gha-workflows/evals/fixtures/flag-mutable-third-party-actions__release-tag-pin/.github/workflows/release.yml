name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: some-vendor/publish-action@v2
        with:
          token: ${{ secrets.NPM_TOKEN }}
      - uses: another-org/deploy@main
        env:
          AWS_ROLE: ${{ secrets.AWS_ROLE }}
